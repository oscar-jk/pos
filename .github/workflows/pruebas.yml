name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

env:
  # La app corre en equipos de República Dominicana (UTC-4); las pruebas de fechas locales lo asumen.
  TZ: America/Santo_Domingo

jobs:
  pruebas:
    name: npm test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Instala dependencias (Electron descarga su binario) y deja better-sqlite3 compilado para
      # Electron: las pruebas corren con el Node de Electron, el mismo binario que usa la app.
      - run: npm ci
      - run: npm run rebuild:electron

      # Los esquemas compilados deben corresponder a los XSD de la DGII.
      - run: node scripts/compilar-esquemas-ecf.js --revisar

      - run: npm test
